datasets:
  bmmc_cite:
    name: BMMC CITE-seq
    rna_path: cache/velocity/bmmc_cite/bmmc_cite_scvelo_results.h5ad
    rna_raw_layer: counts   # file X is already log-normalized; start from raw counts
    protein_path: Datasets/BMMC/GSE194122_openproblems_neurips2021_cite_BMMC_processed.h5ad
    protein_label: ADT

  bmmc_cite_retained:
    name: BMMC CITE-seq (ADT-genes retained)
    rna_path: cache/velocity/bmmc_cite/bmmc_cite_scvelo_results_retained.h5ad
    rna_raw_layer: counts
    protein_path: Datasets/BMMC/GSE194122_openproblems_neurips2021_cite_BMMC_processed.h5ad
    protein_label: ADT

  # Same as bmmc_cite_retained but RNA velocity from RegVelo — the velocity ablation.
  bmmc_cite_regvelo:
    name: BMMC CITE-seq (RegVelo velocity)
    rna_path: cache/velocity/bmmc_cite/bmmc_cite_regvelo_results_retained.h5ad
    rna_raw_layer: counts
    protein_path: Datasets/BMMC/GSE194122_openproblems_neurips2021_cite_BMMC_processed.h5ad
    protein_label: ADT

  bmmc_multiome:
    name: BMMC Multiome
    rna_path: cache/velocity/bmmc_multiome/bmmc_multiome_scvelo_results.h5ad
    atac_path: Datasets/BMMC/GSE194122_openproblems_neurips2021_multiome_BMMC_processed.h5ad
    atac_label: ATAC

  pbmc:
    name: PBMC CITE-seq
    rna_path: cache/velocity/pbmc/pbmc_scvelo_results.h5ad
    rna_raw_layer: counts   # file X is already log-normalized; start from raw counts
    protein_path: Datasets/PBMC/5k_pbmc_protein_v3_nextgem_filtered_feature_bc_matrix.h5
    protein_label: Antibody Capture

  pbmc_retained:
    name: PBMC CITE-seq (ADT-genes retained)
    rna_path: cache/velocity/pbmc/pbmc_scvelo_results_retained.h5ad
    rna_raw_layer: counts
    protein_path: Datasets/PBMC/5k_pbmc_protein_v3_nextgem_filtered_feature_bc_matrix.h5
    protein_label: Antibody Capture

  # Same as pbmc_retained but RNA velocity from RegVelo (GRN-informed) — the
  # velocity-provider ablation. Only rna_path differs.
  pbmc_regvelo:
    name: PBMC CITE-seq (RegVelo velocity)
    rna_path: cache/velocity/pbmc/pbmc_regvelo_results_retained.h5ad
    rna_raw_layer: counts
    protein_path: Datasets/PBMC/5k_pbmc_protein_v3_nextgem_filtered_feature_bc_matrix.h5
    protein_label: Antibody Capture

  perturb:
    name: Perturb-CITE-seq
    rna_path: cache/velocity/perturb/perturb_scvelo_results.h5ad
    protein_path: Datasets/Perturb_CITE_Seq/SCP1064/documentation/Protein_expression.csv.gz
    protein_label: Protein

  papalexi_retained:
    name: Papalexi ECCITE-seq (ADT-genes retained)
    rna_path: cache/velocity/papalexi/papalexi_scvelo_results_retained.h5ad
    rna_raw_layer: counts   # X is raw spliced+unspliced; use the counts layer for normalization
    protein_path: Datasets/Papalexi_GSE153056/papalexi_protein.h5ad
    protein_label: ADT

  # Same as papalexi_retained but RNA velocity from RegVelo — the velocity ablation.
  papalexi_regvelo:
    name: Papalexi ECCITE-seq (RegVelo velocity)
    rna_path: cache/velocity/papalexi/papalexi_regvelo_results_retained.h5ad
    rna_raw_layer: counts
    protein_path: Datasets/Papalexi_GSE153056/papalexi_protein.h5ad
    protein_label: ADT

  synthetic:
    # run first: python -m src.data.synthetic
    name: Synthetic
    rna_path: cache/velocity/synthetic/synthetic_scvelo_results.h5ad
    protein_path: cache/synthetic/protein.h5ad
    protein_label: Protein

  synthetic_linked_ode:
    # Staged v2 synthetic. Generate first, e.g.:
    #   python -m src.data.synthetic_linked_ode --stage oracle
    # Training stages are selected with runner.py --stage; the runner injects
    # the stage-specific paths, so these oracle paths are only the default.
    name: Synthetic Linked ODE
    rna_path: cache/velocity/synthetic_linked_ode/oracle/rna.h5ad
    protein_path: cache/synthetic_linked_ode/oracle/protein.h5ad
    protein_label: Protein

  shareseq_skin:
    name: SHARE-seq Skin
    rna_path: cache/velocity/shareseq_skin/shareseq_skin_scvelo_results.h5ad
    atac_path: Datasets/SHARE_seq/Raw_Files/GSM4156597_skin.late.anagen.counts.txt.gz

  shareseq_brain:
    name: SHARE-seq Brain
    rna_path: cache/velocity/shareseq_brain/shareseq_brain_scvelo_results.h5ad
    atac_path: Datasets/SHARE_seq/Raw_Files/GSM4156599_brain.counts.txt.gz

  shareseq_lung:
    name: SHARE-seq Lung
    rna_path: cache/velocity/shareseq_lung/shareseq_lung_scvelo_results.h5ad
    atac_path: Datasets/SHARE_seq/Raw_Files/GSM4156600_lung.counts.txt.gz
