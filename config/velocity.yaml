defaults:
  output_root: cache/velocity
  n_top_genes: 2000
  n_pcs: 30
  n_neighbors: 30
  min_shared_counts: 20
  hvg_flavor: seurat_v3
  velocity_mode: dynamical
  # Velocity provider: 'scvelo_dynamical' (baseline) or 'regvelo' (GRN-informed).
  # regvelo also needs grn_prior_csv (see tools/build_grn_prior.py) and the
  # regvelo/scvi-tools stack in the container.
  velocity_backend: scvelo_dynamical
  dynamics_n_jobs: 8
  random_state: 0

datasets:
  bmmc_cite:
    mode: starsolo_h5ad
    report: /data2/core-med1-telem/common/Thesis_Jin/Datasets/BMMC/bmmc_starsolo_output_report.tsv
    original_h5ad: /data2/core-med1-telem/common/Thesis_Jin/Datasets/BMMC/GSE194122_openproblems_neurips2021_cite_BMMC_processed.h5ad
    assay: cite
    label: bmmc_cite
    umap_key: GEX_X_umap
    n_top_genes: 2000

  bmmc_cite_retained:
    mode: starsolo_h5ad
    report: /data2/core-med1-telem/common/Thesis_Jin/Datasets/BMMC/bmmc_starsolo_output_report.tsv
    original_h5ad: /data2/core-med1-telem/common/Thesis_Jin/Datasets/BMMC/GSE194122_openproblems_neurips2021_cite_BMMC_processed.h5ad
    assay: cite
    label: bmmc_cite
    umap_key: GEX_X_umap
    n_top_genes: 2000
    retain_genes_csv: cache/results/mapping/adt_mapping_bmmc_cite_retained.csv

  # RegVelo backend variant (writes bmmc_cite_regvelo_results_retained.h5ad).
  bmmc_cite_regvelo_retained:
    mode: starsolo_h5ad
    report: /data2/core-med1-telem/common/Thesis_Jin/Datasets/BMMC/bmmc_starsolo_output_report.tsv
    original_h5ad: /data2/core-med1-telem/common/Thesis_Jin/Datasets/BMMC/GSE194122_openproblems_neurips2021_cite_BMMC_processed.h5ad
    assay: cite
    label: bmmc_cite
    umap_key: GEX_X_umap
    n_top_genes: 2000
    retain_genes_csv: cache/results/mapping/adt_mapping_bmmc_cite_retained.csv
    velocity_backend: regvelo
    grn_prior_csv: cache/results/grn/grn_prior_bmmc_cite.csv
    # 90k cells OOM at RegVelo's default full-batch, but small minibatches make the
    # per-gene likelihood variance collapse (invalid Normal scale -> NaN, crash ~epoch 350).
    # Use a large batch: closer to the stable full-batch regime, still fits ~64 GB.
    regvelo_batch_size: 16384

  bmmc_multiome:
    mode: starsolo_h5ad
    report: /data2/core-med1-telem/common/Thesis_Jin/Datasets/BMMC/bmmc_starsolo_output_report.tsv
    original_h5ad: /data2/core-med1-telem/common/Thesis_Jin/Datasets/BMMC/GSE194122_openproblems_neurips2021_multiome_BMMC_processed.h5ad
    assay: multiome
    label: bmmc_multiome
    umap_key: GEX_X_umap
    n_top_genes: 2000

  pbmc:
    mode: pbmc_10x_loom
    pbmc_counts: Datasets/PBMC/5k_pbmc_protein_v3_nextgem_filtered_feature_bc_matrix.h5
    loom: Datasets/PBMC/pbmc_final_sorted_B4NII.loom
    label: pbmc
    n_top_genes: 2000

  pbmc_retained:
    mode: pbmc_10x_loom
    pbmc_counts: Datasets/PBMC/5k_pbmc_protein_v3_nextgem_filtered_feature_bc_matrix.h5
    loom: Datasets/PBMC/pbmc_final_sorted_B4NII.loom
    label: pbmc
    n_top_genes: 2000
    retain_genes_csv: cache/results/mapping/adt_mapping_pbmc_retained.csv

  # RegVelo backend variant (writes pbmc_regvelo_results_retained.h5ad, alongside
  # the scVelo one) for the velocity-provider ablation.
  pbmc_regvelo_retained:
    mode: pbmc_10x_loom
    pbmc_counts: Datasets/PBMC/5k_pbmc_protein_v3_nextgem_filtered_feature_bc_matrix.h5
    loom: Datasets/PBMC/pbmc_final_sorted_B4NII.loom
    label: pbmc
    n_top_genes: 2000
    retain_genes_csv: cache/results/mapping/adt_mapping_pbmc_retained.csv
    velocity_backend: regvelo
    grn_prior_csv: cache/results/grn/grn_prior_pbmc.csv

  perturb:
    # TODO: set mode once STARsolo alignment is complete for Perturb-CITE-seq.
    # Expected inputs: spliced/unspliced loom or h5ad from STARsolo.
    mode: h5ad
    input_h5ad: Datasets/Perturb_CITE_Seq/SCP1064/velocity/perturb_velocity_input.h5ad
    label: perturb
    n_top_genes: 2000

  # Papalexi ECCITE-seq (GSE153056), pooled 8-lane STARsolo. RNA input h5ad is built
  # by tools/build_papalexi.py (spliced/unspliced from STARsolo Velocyto, cells matched
  # to the ECCITE metadata on the core barcode). Retains the 4 checkpoint-ADT target
  # genes (CD86, CD274, PDCD1LG2, HAVCR2) so KOT's kinetics can use them.
  papalexi_retained:
    mode: h5ad
    input_h5ad: Datasets/Papalexi_GSE153056/papalexi_rna_input.h5ad
    label: papalexi
    n_top_genes: 2000
    retain_genes_csv: cache/results/mapping/adt_mapping_papalexi.csv

  # RegVelo backend for Papalexi (velocity-provider ablation). Same input h5ad as the
  # scVelo variant. grn_prior_csv is the shared human DoRothEA edge list (organism-level;
  # grn_edges_to_matrix intersects it with this dataset's genes), so no rebuild is needed.
  # ~20k cells: use a large minibatch (near full-batch) to stay in RegVelo's stable regime.
  papalexi_regvelo_retained:
    mode: h5ad
    input_h5ad: Datasets/Papalexi_GSE153056/papalexi_rna_input.h5ad
    label: papalexi
    n_top_genes: 2000
    retain_genes_csv: cache/results/mapping/adt_mapping_papalexi.csv
    velocity_backend: regvelo
    grn_prior_csv: cache/results/grn/grn_prior_pbmc.csv
    regvelo_batch_size: 16384

  # SHARE-seq: run velocyto on BAM files first (see velocyto_slurm.sh), then set loom paths below.
  shareseq_skin:
    mode: shareseq_loom
    counts: Datasets/SHARE_seq/Raw_Files/GSM4156608_skin.late.anagen.rna.counts.txt.gz
    loom: Datasets/SHARE_seq/velocyto/skin.late.anagen.rna.norg.loom
    label: shareseq_skin
    n_top_genes: 2000

  shareseq_brain:
    mode: shareseq_loom
    counts: Datasets/SHARE_seq/Raw_Files/GSM4156610_brain.rna.counts.txt.gz
    loom: Datasets/SHARE_seq/velocyto/brain.rna.norg.loom
    label: shareseq_brain
    n_top_genes: 2000

  shareseq_lung:
    mode: shareseq_loom
    counts: Datasets/SHARE_seq/Raw_Files/GSM4156611_lung.rna.counts.txt.gz
    loom: Datasets/SHARE_seq/velocyto/lung.rna.norg.loom
    label: shareseq_lung
    n_top_genes: 0
    min_shared_counts: 1
