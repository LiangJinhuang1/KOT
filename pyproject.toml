[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kot"
version = "0.1.0"
description = "Kinetic optimal transport for single-cell multimodal alignment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scanpy>=1.9",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "seaborn>=0.12",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
kot = [
    "geomloss>=0.2.6",
    "pykeops>=2.2",
    "torch>=2.1",
]
velocity = [
    "scvelo>=0.3",
]
baselines = [
    "moscot>=0.4",
    "scglue>=0.3",
    "scvi-tools>=1.1",
]
regvelo = [
    "decoupler>=2.0",
    "pysam>=0.22",
    "regvelo>=0.1",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
kot = "kot.__main__:main"
kot-generate = "src.data.synthetic_linked_ode:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kot*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["vendor", "archive"]
